[project]
name = "pyNei"
version = "0.1.0"
description = "Population genetics with python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "more-itertools>=11.0.1",
    "numpy>=2.4.6",
    "pandas>=3.0.2",
    "pyarrow>=22.0.0",
    # 0.1.2 is the first one whose map() does not drop results when the
    # work reaches more than one thread
    "threaded-map-reduce>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.6.1", "pytest>=9.0.2", "pytest-pyodide>=0.58.4"]
